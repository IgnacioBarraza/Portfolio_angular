<div class="group relative bg-zinc-900 rounded-md overflow-hidden border border-zinc-800 hover:border-red-500/50 transition-all duration-300 min-h-[550px] flex flex-col">
  <div class="aspect-video relative overflow-hidden">
    <img
      [src]="projectsData.imageUrl || '/placeholder.svg'"
      [alt]="projectsData.title"
      width="400"
      height="300"
      class="object-cover w-full h-full group-hover:scale-105 transition-transform duration-500"
    />
    <div class="absolute inset-0 bg-gradient-to-t from-zinc-950 to-transparent opacity-60"></div>
  </div>

  <div class="p-6 flex flex-col flex-grow">
    <h3 class="text-xl font-semibold mb-2">{{ projectsData.title }}</h3>
    <p class="text-zinc-400 text-sm mb-4">{{ projectsData.description }}</p>

    <div class="flex flex-wrap gap-2 mb-4">
      @for (tag of projectsData.tags; track $index) {
        <span class="text-xs px-2 py-1 bg-zinc-800 text-zinc-300 rounded-md">
          {{tag}}
        </span>
      }
    </div>

    <div class="flex justify-between items-center mt-auto">
      <button class="text-red-500 hover:text-red-400 p-0 flex items-center gap-2" (click)="goToDemo(projectsData.demoLink)">
        View Project <fa-icon [icon]="externalLink" />
      </button>
      <button class="text-red-500 hover:text-red-400 p-0 flex items-center gap-2" (click)="goToCode(projectsData.codeLink)">
        View Code <fa-icon [icon]="github" />
      </button>
    </div>
  </div>

  <div class="absolute top-3 right-3 opacity-0 group-hover:opacity-100 transition-opacity">
    <div class="w-2 h-2 rounded-full bg-red-500"></div>
  </div>
</div>
