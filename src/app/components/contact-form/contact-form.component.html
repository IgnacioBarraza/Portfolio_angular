<form class="space-y-4">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="space-y-2">
      <label htmlFor="name" class="block text-sm font-medium">
        {{ 'contact.form1' | transloco }}
      </label>
      <input
        id="name"
        type="text"
        class="w-full px-4 py-2 bg-zinc-800 border border-zinc-700 rounded-md focus:outline-none focus:ring-2 focus:ring-red-500"
      />
    </div>
    <div class="space-y-2">
      <label htmlFor="email" class="block text-sm font-medium">
        {{ 'contact.form2' | transloco }}
      </label>
      <input
        id="email"
        type="email"
        class="w-full px-4 py-2 bg-zinc-800 border border-zinc-700 rounded-md focus:outline-none focus:ring-2 focus:ring-red-500"
      />
    </div>
  </div>
  <div class="space-y-2">
    <label htmlFor="message" class="block text-sm font-medium">
      {{ 'contact.form3' | transloco }}
    </label>
    <textarea
      id="message"
      rows={5}
      class="w-full px-4 py-2 bg-zinc-800 border border-zinc-700 rounded-md focus:outline-none focus:ring-2 focus:ring-red-500"
    ></textarea>
  </div>
  <button class="w-full bg-red-500 hover:bg-red-600 text-white p-2 rounded">{{ 'contact.sendMessage' | transloco }}</button>
</form>
