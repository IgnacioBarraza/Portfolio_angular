<div class="relative pl-8 pb-12">
  <!-- {/* Timeline line */} -->
   @if (!workExperience.isLast) {
    <div class="absolute left-3 top-3 bottom-0 w-px bg-zinc-700"></div>
   }

  <!-- {/* Timeline dot */} -->
  <div class="absolute left-0 top-3 w-6 h-6 rounded-full bg-red-500 flex items-center justify-center">
    <div class="w-2 h-2 rounded-full bg-zinc-900"></div>
  </div>

  <!-- {/* Content */} -->
  <div class="bg-zinc-800 rounded-lg p-6 hover:bg-zinc-800/80 transition-colors border border-zinc-700 hover:border-red-500/30">
    <div class="flex flex-col md:flex-row md:items-center justify-between mb-4">
      <h3 class="text-xl font-semibold">{{ workExperience.title | transloco }}</h3>
      <span class="text-red-500 font-medium">{{ workExperience.period | transloco }}</span>
    </div>
    <h4 class="text-lg text-zinc-300 mb-3">{{ workExperience.company }}</h4>
    <p class="text-zinc-400 mb-4">{{ workExperience.description | transloco }}</p>

    <div class="flex flex-wrap gap-2">
      @for (tech of workExperience.technologies; track $index) {
        <span class="text-xs px-2 py-1 bg-zinc-700 text-zinc-300 rounded-md">
          {{ tech }}
        </span>
      }
    </div>
  </div>
</div>
